name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v1
        with:
          python-version: "3.8"
      - run: python -m unittest discover -s tests -v
      - run: echo "hello world" | python pygrep.py -n hello
